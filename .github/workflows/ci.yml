name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install Python from .python-version
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --no-dev

      - name: Run unit tests
        run: |
          uv run --no-sync python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          if suite.countTestCases() == 0:
              raise SystemExit("No unit tests were discovered.")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  langgraph-startup:
    name: langgraph-startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install Python from .python-version
        run: uv python install

      - name: Install locked dependencies including the dev server
        run: uv sync --locked --dev

      - name: Check LangGraph startup and registered graphs
        run: uv run --no-sync python .github/scripts/check_langgraph_startup.py
